<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escala OGMO · São Sebastião</title><meta name="theme-color" content="#0b3a5b">
<style>
:root{--bg:#f3f6f9;--card:#fff;--tx:#0f2233;--mut:#5b7083;--ac:#0e7c86;--ac2:#0b3a5b;--bd:#dde5ec;--ok:#1f9d55}
@media(prefers-color-scheme:dark){:root{--bg:#0b1620;--card:#13222f;--tx:#e8f0f6;--mut:#8aa1b3;--ac:#3cc2cc;--bd:#223646}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#0b3a5b,#0e7c86);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 56px}
header h1{margin:0;font-size:1.35rem;letter-spacing:.2px}header p{margin:4px 0 0;opacity:.85;font-size:.9rem}
nav{display:flex;gap:6px;max-width:980px;margin:-34px auto 0;padding:0 14px;position:relative}
nav button{flex:1;border:0;border-radius:12px;padding:12px 8px;font:600 .95rem inherit;background:var(--card);color:var(--mut);box-shadow:0 2px 8px #0002;cursor:pointer}
nav button.on{color:#fff;background:var(--ac2)}@media(prefers-color-scheme:dark){nav button.on{background:var(--ac);color:#06222a}}
main{max-width:980px;margin:14px auto;padding:0 14px 40px}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top b{font-size:1.05rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:4px 10px;border-radius:99px;background:#1f9d5522;color:var(--ok);font-weight:600}
.chip.old{background:#e0a80022;color:#b07a00}.mut{color:var(--mut);font-size:.85rem}
.shot{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:#000;cursor:zoom-in}.shot img{display:block;width:100%;height:auto}
.hint{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;font-size:.75rem;padding:4px 9px;border-radius:8px}
select,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px}.btn{cursor:pointer;text-decoration:none;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bol{padding:0;overflow:hidden;cursor:pointer}.bol .th{aspect-ratio:4/3;background:#0b3a5b14 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.bol div.t{padding:10px 12px}.bol b{display:block}h2{font-size:1rem;margin:18px 2px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
#lb{position:fixed;inset:0;background:#000e;display:none;z-index:9;overflow:auto;-webkit-overflow-scrolling:touch}#lb.on{display:block}
#lb img{display:block;margin:0 auto;max-width:100%;cursor:zoom-in}#lb img.z{max-width:none;width:230%;cursor:zoom-out}
#x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:10;display:none;border:0;border-radius:99px;width:42px;height:42px;font-size:1.3rem;background:#fff;color:#000}#lb.on~#x{display:block}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:6px 14px 30px}
</style></head><body>
<header><h1>⚓ Escala OGMO · São Sebastião</h1><p>Planilha e boletins de cada período, sempre atualizados</p></header>
<nav><button class="on" data-s="escala">Escala</button><button data-s="boletins">Boletins</button></nav>
<main>
<section id="escala" class="on">
 <div class="card"><div class="top"><div><b id="tit">Carregando…</b><div class="mut" id="quando"></div></div><span class="chip" id="chip" hidden></span></div>
  <div class="shot" id="shot" hidden><img id="img" alt="Planilha da escala"><span class="hint">Toque para ampliar</span></div>
  <div class="top" style="margin-top:12px"><select id="hist" aria-label="Atualizações anteriores"></select><a class="btn" id="dl" download target="_blank" rel="noopener">Baixar imagem</a></div></div>
</section>
<section id="boletins">
 <div class="card top"><b>Boletins</b><select id="dia" aria-label="Escolher dia"></select></div><div id="bols"></div>
</section></main>
<footer>As informações são calculadas pelo robô da escala e podem mudar. Em caso de dúvida, vale a decisão do OGMO.</footer>
<div id="lb"><img id="lbi" alt=""></div><button id="x" aria-label="Fechar">✕</button>
<script>
const $=s=>document.querySelector(s),T=()=>Math.floor(Date.now()/60000);
const J=async p=>{try{const r=await fetch(p+'?t='+T(),{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}};
const fmt=d=>new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const ago=d=>{const m=Math.max(0,Math.round((Date.now()-new Date(d))/60000));return m<1?'agora mesmo':m<60?`há ${m} min`:m<1440?`há ${Math.floor(m/60)} h`:`há ${Math.floor(m/1440)} d`};
let E=null;
function mostra(it){$('#tit').textContent=it.titulo||'Planilha da escala';$('#quando').textContent='Atualizada em '+fmt(it.quando);
 $('#img').src=it.imagem+'?v='+encodeURIComponent(it.quando);$('#dl').href=it.imagem;$('#shot').hidden=false;
 const c=$('#chip'),h=(Date.now()-new Date(it.quando))/36e5;c.hidden=false;c.className='chip'+(h>8?' old':'');c.textContent=(h>8?'● ':'● ')+ago(it.quando)}
async function escala(){const d=await J('dados/escala.json');if(!d||!d.imagem){$('#tit').textContent='Ainda não há planilha publicada';return}
 E=d;const hs=d.historico&&d.historico.length?d.historico:[{quando:d.atualizado_em,titulo:d.titulo,imagem:d.imagem}];
 const sel=$('#hist'),cur=sel.value;sel.innerHTML=hs.map((h,i)=>`<option value="${i}">${i?'':'Mais recente · '}${fmt(h.quando)} — ${h.titulo||''}</option>`).join('');
 sel.value=cur&&hs[cur]?cur:0;mostra(hs[sel.value]);E.h=hs}
$('#hist').onchange=e=>mostra(E.h[e.target.value]);
let B=[];async function bol(){const d=await J('dados/boletins.json');B=Array.isArray(d)?d:[];
 const dias=[...new Set(B.map(b=>b.data))],s=$('#dia'),cur=s.value;s.innerHTML=`<option value="">Todos os dias</option>`+dias.map(x=>`<option>${x}</option>`).join('');s.value=dias.includes(cur)?cur:'';pinta()}
function pinta(){const f=$('#dia').value,L=B.filter(b=>!f||b.data===f);if(!L.length){$('#bols').innerHTML='<div class="empty card">Nenhum boletim publicado ainda.</div>';return}
 const g={};L.forEach(b=>(g[b.data]=g[b.data]||[]).push(b));
 $('#bols').innerHTML=Object.keys(g).map(k=>`<h2>${k}</h2><div class="grid">`+g[k].map(b=>{const pdf=/\.pdf$/i.test(b.arquivo);
  return `<div class="card bol" data-a="${b.arquivo}" data-p="${pdf}"><div class="th" style="${pdf?'':`background-image:url('${b.arquivo}')`}">${pdf?'📄':''}</div><div class="t"><b>${b.titulo||'Boletim'}</b><span class="mut">${b.periodo||''}${b.periodo?' · ':''}${fmt(b.enviado_em)}</span></div></div>`}).join('')+'</div>').join('')}
$('#dia').onchange=pinta;
document.addEventListener('click',e=>{const c=e.target.closest('.bol');if(c){c.dataset.p==='true'?open(c.dataset.a,'_blank'):abre(c.dataset.a)}else if(e.target.closest('#shot'))abre($('#img').src)});
function abre(u){$('#lbi').src=u;$('#lbi').className='';$('#lb').classList.add('on')}
$('#lbi').onclick=e=>e.target.classList.toggle('z');$('#x').onclick=()=>$('#lb').classList.remove('on');
document.onkeydown=e=>e.key==='Escape'&&$('#x').click();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.s).classList.add('on');history.replaceState(0,'','#'+b.dataset.s)});
if(location.hash==='#boletins')document.querySelector('[data-s=boletins]').click();
const tudo=()=>{escala();bol()};tudo();setInterval(tudo,6e4);document.addEventListener('visibilitychange',()=>!document.hidden&&tudo());
</script></body></html>
